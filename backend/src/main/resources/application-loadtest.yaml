# 부하 테스트 전용 설정: 실행할 때만 --spring.profiles.active=loadtest 로 켠다.
# 개발용 DB(naegi)와 분리된 naegi_load DB를 쓰고, 측정을 왜곡하는 SQL·TRACE 로그를 끈다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/naegi_load
    username: naegi
    password: naegi
    driver-class-name: org.postgresql.Driver
    hikari:
      # 풀 크기를 명시해 결과 문서에 함께 기록한다. (환경변수로 바꿔 가며 비교할 수 있다)
      maximum-pool-size: ${LOADTEST_POOL_SIZE:10}
  output:
    ansi:
      enabled: never
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        use_sql_comments: false
        # 요청 한 번에 나간 SQL 수와 엔티티 로딩 수를 센다. (WeeklyCheckLoadTestController가 사용)
        generate_statistics: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.orm.jdbc.extract: INFO
    org.springframework.transaction.interceptor: INFO
    com.back: INFO
